services:
  ollama:
    image: ollama/ollama:0.11.11-rc0
    #container_name: ollama-service
    deploy:
      resources:
        limits:
          cpus: "${LIMIT_CPUS}"
          memory: "${LIMIT_MEMORY}"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /home/ubuntu/Documents/ollama_data:/root/.ollama
    #ports:
    #- "11434:11434"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL}
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION}
      - OLLAMA_KV_CACHE_TYPE=${OLLAMA_KV_CACHE_TYPE}
      - OLLAMA_MAX_WORKERS=${OLLAMA_MAX_WORKERS}
      - OLLAMA_NUM_THREADS=${OLLAMA_NUM_THREADS}
      - OLLAMA_CACHE_SIZE=${OLLAMA_CACHE_SIZE}
      - OLLAMA_ENABLE_PARALLEL_DECODE=${OLLAMA_ENABLE_PARALLEL_DECODE}
      # - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "30"
    networks:
      - ollama-net

  nginx:
    image: nginx:1.25.3-alpine3.18
    container_name: ollama-lb
    ports:
      - "${PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
    restart: unless-stopped
    depends_on:
      - ollama
    networks:
      - ollama-net

volumes:
  ollama_data:

networks:
  ollama-net:
    driver: bridge
