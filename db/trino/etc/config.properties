#single node install config
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
query.max-memory=1GB 
query.max-memory-per-node=512MB
discovery.uri=http://localhost:8080
# discovery.uri=https://localhost:8443
catalog.management=${ENV:CATALOG_MANAGEMENT}

http-server.authentication.type=PASSWORD

# 密码校验（password.db）只在 TLS 连接上生效：明文 HTTP 下带密码的 Basic
# 认证一律被拒（401 "Password not allowed for insecure authentication"），
# 这是硬编码行为，与本开关无关。
# 本开关的作用是允许 HTTP 走 "insecure" 认证：客户端只传用户名（Basic 空密码，
# 如 admin:，或 X-Trino-User / X-Trino-Original-User 头），服务端直接信任该
# 用户名，不校验任何密码。本地开发客户端应按此方式连接。
# 要启用真正的密码认证：跑 setup-certs.sh，启用 http-server.https.*，客户端
# 走 HTTPS + admin:admin123。
http-server.authentication.allow-insecure-over-http=true

# 当开启认证后，必须配置此项，用于节点间通信签名
internal-communication.shared-secret=32e5b096d21ba2b43c932545301626d2

