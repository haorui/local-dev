services:
  oracle:
    image: container-registry.oracle.com/database/free:23.4.0.0-lite
    container_name: oracle-23
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PDB=freedb
      - ORACLE_PWD=Pwd2026Db
    volumes:
      - oracle-volume:/opt/oracle/oradata
      - oracle-logs:/opt/oracle/logs

volumes:
  oracle-volume:
  oracle-logs:
