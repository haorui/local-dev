status = INFO
name = HiveLog4j2

# Disable threshold filter to allow DEBUG/WARN logs
# filters = threshold
# filter.threshold.type = ThresholdFilter
# filter.threshold.level = INFO

appenders = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} [%t] %-5p %c{1} - %m%n

rootLogger.level = DEBUG
rootLogger.appenderRefs = console
rootLogger.appenderRef.console.ref = console

# Enable DEBUG for HiveServer2 to see our debug logs
logger.hiveserver2.name = org.apache.hive.service.server.HiveServer2
logger.hiveserver2.level = DEBUG
logger.hiveserver2.appenderRefs = console
logger.hiveserver2.appenderRef.console.ref = console


