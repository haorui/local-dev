Server {
  com.sun.security.auth.module.Krb5LoginModule required
  useKeyTab=true
  storeKey=true
  doNotPrompt=true
  useTicketCache=false
  keyTab="/etc/security/keytabs/zookeeper.keytab"
  principal="zookeeper/zookeeper-zoo2-1.dev_db_network@TEST.COM";
};

Client {
  com.sun.security.auth.module.Krb5LoginModule required
  useKeyTab=true
  storeKey=true
  doNotPrompt=true
  useTicketCache=false
  keyTab="/etc/security/keytabs/zookeeper.keytab"
  # Principal 配置说明：
  # - 使用容器 FQDN 主体：zookeeper/zookeeper-zoo2-1.dev_network@TEST.COM
  # - 原因：在集群模式下，使用容器 FQDN 可以确保客户端通过 GSSAPI 查找服务票据时
  #   能够正确匹配服务主体（客户端会使用容器的 FQDN 来请求服务票据）
  # - 该主体在 KDC 中应该存在：zookeeper/zookeeper-zoo2-1.dev_db_network@TEST.COM
  # - 如果使用短名 zookeeper/zoo2@TEST.COM，客户端可能无法正确匹配服务主体
  principal="zookeeper/zookeeper-zoo2-1.dev_db_network@TEST.COM";
};



