services:
  mysql8:
    image: mysql:8.4.3
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - dev_db_network
    ports:
      - "15001:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Pwd2026Db
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - mysql8-data:/var/lib/mysql
    command:
      - --log-error-suppression-list=MY-012637,MY-012638,MY-012642,MY-012592,MY-012596
      - --innodb-open-files=4000
      - --open-files-limit=65536
      - --innodb-io-capacity=200
      - --innodb-io-capacity-max=2000
    healthcheck:
      test: "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  dev_db_network:
    external: true

volumes:
  mysql8-data:
