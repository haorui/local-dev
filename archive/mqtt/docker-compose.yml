services:
  emqx:
    #image: emqx:5.7
    image: registry.dataleapinfo.com:8443/library/emqx:5.7
    restart: always
    ports:
      - 1883:1883
      - 8083:8083
      - 8883:8883
      - 18083:18083
    environment:
      EMQX_NODE__NAME: db_emqx@127.0.0.1
    volumes:
      - vol-emqx-data:/opt/emqx/data
      - vol-emqx-log:/opt/emqx/log

volumes:
  vol-emqx-data:
    name: db-emqx-data
  vol-emqx-log:
    name: db-emqx-log
