  smartdata-admin:
    container_name: smartdata_admin
    build:
      context: ../../smartdata/
      dockerfile: .ci/docker/smartdata-admin.Dockerfile
    ports:
      - "8084:8084"
    networks:
      - dev_db_network
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms512m -Xmx1024m
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_NAME=smartdata_dev
      - db_password=${DB_PASSWORD}
      # redis single
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # sso
      - SSO_URL=${SSO_URL}
      - SSO_CLEAR_PATH=${SSO_URL}/token/revocation
      - APP_DOMAIN=
      - APP_TITLE=${DB_APP_TITLE}
      - APP_SHORT_TITLE=${DB_APP_SHORT_TITLE}
      - CID=${UNIQUE_ID}
      - JUMPER_URL=${JUMPER_URL}
    volumes:
      - ${HOME}/.smartdata/plugins/:/root/.smartdata/plugins/
      - ./license:/app/smartdb/license
      - ./monitor.json:/app/smartdb/monitor.json
      - server_data:/app/smartdb
      - server_logs:/data/smartdb/logs
    secrets:
      - db_password

