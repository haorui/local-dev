volumes:
  dbmanager_node_modules:
  server_data:
  server_logs:
  zoo_data:
  zoo_datalog:
  zoo_logs:

networks:
  dev_db_network:
    external: true
  dev_sso_network:
    external: true
  redis:
    external: true
  sharding_net:
    driver: bridge

secrets:
  db_password:
    # external: true
    file: ./db_password
