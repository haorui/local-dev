bind 0.0.0.0
port 6379
protected-mode no
# RDB only: a dev box that fills its Docker disk leaves a torn AOF that
# crash-loops Redis on the next restart; a graceful stop still saves dump.rdb.
appendonly no
save 900 1
save 300 10
save 60 10000
# requirepass comes from REDIS_PASSWORD (.env) via --requirepass in
# docker-compose.yml; redis.conf cannot read environment variables.
