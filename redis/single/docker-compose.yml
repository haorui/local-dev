services:
  service:
    image: redis:7.2-alpine3.18
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: always
    networks:
      dev_db_network:
        aliases:
          - smartdata-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf
      - data:/data
    # PING fails with MISCONF when persistence writes fail (e.g. disk full).
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a 'Zonesec2024.' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  data:

networks:
  dev_db_network:
    external: true
