networks:
  sentinel-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.31.1.0/24

services:
  redis-master:
    container_name: redis-master
    image: redis:7.2-alpine3.18
    restart: always
    volumes:
      - ./master/conf:/usr/local/etc/redis
      - master-data:/data
    ports:
      - "7001:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      sentinel-network:
        ipv4_address: 172.31.1.2

  redis-replica1:
    container_name: redis-replica1
    image: redis:7.2-alpine3.18
    restart: always
    volumes:
      - ./replica1/conf:/usr/local/etc/redis
      - replica1-data:/data
    ports:
      - "7002:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    depends_on:
      - redis-master
    networks:
      sentinel-network:
        ipv4_address: 172.31.1.3

  redis-replica2:
    container_name: redis-replica2
    image: redis:7.2-alpine3.18
    restart: always
    volumes:
      - ./replica2/conf:/usr/local/etc/redis
      - replica2-data:/data
    ports:
      - "7003:6379"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    depends_on:
      - redis-master
    networks:
      sentinel-network:
        ipv4_address: 172.31.1.4

  redis-sentinel1:
    container_name: redis-sentinel1
    image: redis:7.2-alpine3.18
    restart: always
    volumes:
      - ./sentinel1/conf:/usr/local/etc/redis
      - sentinel1-data:/data
    ports:
      - "27001:26379"
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    depends_on:
      - redis-master
    networks:
      sentinel-network:
        ipv4_address: 172.31.1.11

  redis-sentinel2:
    container_name: redis-sentinel2
    image: redis:7.2-alpine3.18
    restart: always
    volumes:
      - ./sentinel2/conf:/usr/local/etc/redis
      - sentinel2-data:/data
    ports:
      - "27002:26379"
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    depends_on:
      - redis-master
    networks:
      sentinel-network:
        ipv4_address: 172.31.1.12

  redis-sentinel3:
    container_name: redis-sentinel3
    image: redis:7.2-alpine3.18
    restart: always
    volumes:
      - ./sentinel3/conf:/usr/local/etc/redis
      - sentinel3-data:/data
    ports:
      - "27003:26379"
    command: ["redis-sentinel", "/usr/local/etc/redis/sentinel.conf"]
    depends_on:
      - redis-master
    networks:
      sentinel-network:
        ipv4_address: 172.31.1.13

volumes:
  master-data:
  replica1-data:
  replica2-data:
  sentinel1-data:
  sentinel2-data:
  sentinel3-data:
