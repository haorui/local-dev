# 8446 — SmartData caller-credential registry (shared-secret connector on smartdata-admin:8445).
# Mirrors smartdb-installer config/nginx/default.conf registry vhost. Only the contract
# prefix is proxied; everything else 404. No `allow` lists: traffic through docker-proxy
# arrives with the bridge as source address, so an allowlist would admit every container.
server {
    listen 8446 ssl;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Resolve at request time (same rule as prod-aide.conf): a static upstream block
    # would hold a stale IP across container recreates and [emerg] at startup if absent.
    resolver 127.0.0.11 valid=10s;

    # No URI on proxy_pass: the admin serves the contract paths verbatim.
    # Exact-match wins over the prefix location, so nginx's automatic
    # trailing-slash redirect for a URI-less proxy_pass never fires here.
    location = /trusted-proxy/caller-credential { return 404; }
    location /trusted-proxy/caller-credential/ {
        set $registry http://smartdata-smartdata-admin-1:8445;
        proxy_pass $registry;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}
