# prod.smartdata.local — leap-aide rendered deployment(验收栈,模拟生产)
#
# 2026-08-05 起,主机名按环境拆分:
#   dev.smartdata.local  → dev stack 直连(host 原生进程,见 default.conf)
#   prod.smartdata.local → leap-aide-prod(provisioner apply 渲染的 compose,
#                          内层 aide-nginx 承担动态路由/前缀剥离/auth_request)
#
# 本文件现在承担 W1a 外层契约的五条站点根 prefix location
# (/aide、/aide-admin、/leap-aide 以及 #998 的 /__openclaw__/、
# /api/leap-aide/),并承担沙箱 TLS 监听,不再只是三条静态 prefix 代理
# (leap-aide `docs/architecture/web-tier-deployment.md` §2),
# 外加 SSO 登录链路所需的 /db/(登录页)与 /dbapi/(其 API):
# 原生 Control UI 未认证时由内层 nginx 302 到同 host 的 /db/login,admin-console
# 则由其 SPA 自行跳转到 /db/login;
# cookie 按 host 隔离,所以这两条必须在本 server 内可达。
#
# TLS 证书:ssl/selfsigned.{crt,key} 由 mkcert 生成,SAN 需同时含
# dev.smartdata.local 与 prod.smartdata.local(见 nginx/README.md)。
# /etc/hosts 需有 `127.0.0.1 prod.smartdata.local`。

server {
    listen      443 ssl;
    server_name prod.smartdata.local;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubdomains; preload";

    client_max_body_size 100M;

    # ⚠️ 必须请求时解析,不要用 upstream 块:aide-nginx 在 leap-aide-edge 上的
    # 地址是动态的,内层任一次 recreate 都会换地址,upstream 块会握着过期 IP 把
    # 整站 502(且外层先于内层启动会直接 [emerg])。
    resolver 127.0.0.11 valid=10s;

    # ── SSO 登录链路(dbmanager)。cookie 以本 host 为界,登录必须发生在
    #    prod.smartdata.local 自己身上。
    location /db/ {
        proxy_pass http://host.docker.internal:3013/db/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /dbapi/ {
        proxy_pass http://host.docker.internal:8084/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── leap-aide W1a 外层契约:五条站点根 prefix → 内层 aide-nginx ────────
    # 原生 OpenClaw Control UI,由用户的 gateway 提供(prefix 保留;
    # controlUi.basePath = /aide)。裸 /aide 是 UI 自动探测的 WebSocket URL,
    # 所以这里不带尾斜杠;GET 裸 /aide 由网关自己返回相对 302 → /aide/。
    # auth(aide-auth 的 auth_request)与 SSO 302 重定向都在内层 aide-nginx,
    # 外层不处理。
    location /aide {
        set $aide_inner http://aide-nginx:80;
        proxy_pass $aide_inner;
        proxy_set_header Host $host;
        proxy_set_header x-forwarded-proto $scheme;   # 覆写而非透传:TLS 在本层终结
        proxy_set_header x-forwarded-for   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    # admin console(最长前缀优先于 /aide)。
    location /aide-admin {
        set $aide_inner http://aide-nginx:80;
        proxy_pass $aide_inner;
        proxy_set_header Host $host;
        proxy_set_header x-forwarded-proto $scheme;
        proxy_set_header x-forwarded-for   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    # 每用户 gateway(control UI / chat 全走 WS)。prefix 形式同时覆盖
    # /leap-aide/u/<id>/ 与 control UI 自动探测的裸 /leap-aide/u/<id>。
    # 本层不做 auth_request —— x-forwarded-user 由内层的 auth_request 产出。
    location /leap-aide {
        set $aide_inner http://aide-nginx:80;
        proxy_pass $aide_inner;
        proxy_set_header Host $host;
        proxy_set_header x-forwarded-proto $scheme;
        proxy_set_header x-forwarded-for   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # ── #998 站点根前缀:canvas/cap 包裹路径与 artifact URL ───────────────
    # 这里只负责转发;实际白名单及 401/404 决策由内层 aide-nginx 执行。
    location ^~ /__openclaw__/ {
        set $aide_inner http://aide-nginx:80;
        proxy_pass $aide_inner;
        proxy_set_header Host $host;
        proxy_set_header x-forwarded-proto $scheme;
        proxy_set_header x-forwarded-for   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    location ^~ /api/leap-aide/ {
        set $aide_inner http://aide-nginx:80;
        proxy_pass $aide_inner;
        proxy_set_header Host $host;
        proxy_set_header x-forwarded-proto $scheme;
        proxy_set_header x-forwarded-for   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}

# ── 沙箱第二跳:Control UI 将 origin 端口替换为网关报告的 sandboxPort(18790),
#    保持同一主机名与证书,不需改 DNS;内层 aide-nginx:18790 通过
#    leap-aide-edge docker network 访问,不发布内层端口。
server {
    listen 18790 ssl;
    server_name prod.smartdata.local;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=10s;

    location = /mcp-app-sandbox {
        set $aide_inner_sandbox http://aide-nginx:18790;
        proxy_pass $aide_inner_sandbox;
        proxy_set_header Host $host;
        proxy_set_header x-forwarded-proto $scheme;
        proxy_set_header x-forwarded-host  $host;
        proxy_set_header x-forwarded-for   $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name  prod.smartdata.local;
    return 301 https://$host$request_uri;
}
