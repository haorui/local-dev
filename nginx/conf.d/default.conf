    # ══ leap-aide 路由已按 host 拆分(2026-08-05) ═════════════════════════
    # prod.smartdata.local → 渲染部署(leap-aide-prod 验收栈,W1a 外层契约的
    #   三条静态 prefix → 内层 aide-nginx),见 conf.d/prod-aide.conf。
    # dev.smartdata.local(本 server)→ 恢复 dev-stack 直连:host 原生进程
    #   aide-auth :3181 / admin :3280 / gateway :18789,auth_request 在本层。
    #   chat-shell (/aide-old/, :3180) 已撤(2026-09-06,leap-aide #963 W1⑦):
    #   /aide/ 是原生 Control UI,认证权威在 aide-auth(leap-aide #977)。
    # W1a repoint 期间(2026-08-04~05)这三条前缀曾在本 server 指向内层
    #   aide-nginx;该形态原样迁去了 prod-aide.conf。
    # ══ dev-stack 直连(2026-08-05 恢复) ══════════════════════════════════
    # ── leap-aide auth authority (aide-auth) ─────────────────────────────
    # COOKIE CONTRACT: these routes depend on dbmanager's `authorized-token`
    # cookie (js-cookie default path=/, host dev.smartdata.local) being present
    # AND non-expired. The WS
    # auth_request forwards it ($http_cookie) to /api/auth/check, which writes
    # the broker session key `leapaide:user:<id>` with TTL = cookie.expires - now.
    # So a short/stale cookie `expires` cascades: browser deletes the cookie
    # (SPA → /db/login redirect) and/or the broker returns user-not-found even
    # with an otherwise-valid JWT. Path is NOT the issue (js-cookie default is /);
    # the load-bearing field is `expires`. (Observed in dev 2026-06-23.)
    #
    # Internal auth probe: aide-auth validates the SmartData cookie and echoes
    # X-Aide-User. `internal` keeps it off the public surface (auth_request only).
    location = /aide/api/auth/check {
        internal;
        proxy_pass http://aide_auth/api/auth/check;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    # Public aide-auth routes under the Control UI prefix: the keepalive script
    # (leap-aide #978) and /api/account-status. Exact matches only — a prefix
    # location here would let /aide/api/auth/check/ (trailing slash) slip past
    # the `internal` probe above. No auth_request; the service answers itself.
    location = /aide/api/auth/keepalive.js {
        proxy_pass http://aide_auth/api/auth/keepalive.js;
        proxy_set_header Host $host;
    }
    location = /aide/api/account-status {
        proxy_pass http://aide_auth/api/account-status;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }
    # leap-aide admin console (L1 operator UI) → Vite :5280 (2026-08-05).
    # NO trailing slash on proxy_pass: keep the /aide-admin prefix (matches
    # Vite base, same contract as /aide-wt/). Upgrade headers carry Vite's HMR
    # websocket — run dev:client with VITE_PROXY_HOST=dev.smartdata.local so
    # Vite accepts this Host and pins HMR to wss:443. API rides Vite's own
    # /aide-admin/api proxy to :3280. No auth_request at this layer — the admin
    # server guards per-request when wired to real sources; mock mode has
    # nothing to guard.
    location /aide-admin {
        proxy_pass http://aide_admin_vite;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE (/aide-admin/api/events): no buffering, long read timeout (leap-aide #833).
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    # leap-aide worktree dev frontend (Vite :5181, base=/aide-wt/). Parallel path
    # so a worktree UI can be verified in the browser without disturbing the main
    # checkout's /aide/. NO trailing slash on proxy_pass: keep the /aide-wt/ prefix
    # (matches Vite base). Upgrade headers carry Vite's HMR websocket. The SPA
    # reuses the SAME backend as /aide/: gateway WS via /leap-aide/u/admin/ below,
    # auth via /aide/api/auth/check. Remove this block + reload to retire it.
    location /aide-wt/ {
        proxy_pass http://aide_wt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # Second worktree slot (Vite :5182, base=/aide-wt2/). Same contract as
    # /aide-wt/ above — reuses /aide/'s auth check + the shared gateway WS — but a
    # separate port so two worktrees verify in parallel. Remove + reload to retire.
    location /aide-wt2/ {
        proxy_pass http://aide_wt2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # Per-user OpenClaw gateway. auth_request → X-Aide-User → x-forwarded-user
    # for OpenClaw trusted-proxy auth.
    #
    # The three gateway blocks below also send x-real-ip. On Docker Desktop the
    # browser on the Mac and this proxy both reach the gateway's published port
    # as 192.168.65.1, so the x-forwarded-for chain contains only the trusted
    # proxy address and OpenClaw >= 2026.8.1 fails closed with
    # 403 proxy_attribution_required. The gateway (dev template) sets
    # gateway.allowRealIpFallback and takes the client address from x-real-ip.
    # leap-aide plugin HTTP routes (`/api/leap-aide/*`, used by chat-shell for
    # artifacts / warnings) are matched by the gateway on the UNPREFIXED path, so
    # this block strips the user prefix.
    location /leap-aide/u/admin/api/leap-aide/ {
        auth_request /aide/api/auth/check;
        auth_request_set $aide_user $upstream_http_x_aide_user;
        proxy_set_header x-forwarded-user  $aide_user;
        proxy_set_header x-forwarded-proto $scheme;
        proxy_set_header x-forwarded-host  $host;
        proxy_set_header x-forwarded-for   $proxy_add_x_forwarded_for;
        proxy_set_header x-real-ip         $remote_addr;
        proxy_http_version 1.1;
        rewrite ^/leap-aide/u/admin/(.*)$ /$1 break;
        proxy_pass http://openclaw_admin;
    }
    # Everything else keeps the prefix: the gateway runs with
    # `gateway.controlUi.basePath = "/leap-aide/u/admin"` (dev template), which
    # makes it serve the native Control UI document + `/assets/*` ONLY under that
    # prefix (it rewrites the index's asset hrefs to `<basePath>/assets/…`; with
    # the prefix stripped the document 404s and the assets resolve to the site
    # root). The chat-shell WebSocket (`wss://…/leap-aide/u/admin/`) also lands
    # here — the upgrade handler does not check the path.
    location /leap-aide/u/admin/ {
        auth_request /aide/api/auth/check;
        auth_request_set $aide_user $upstream_http_x_aide_user;
        proxy_set_header x-forwarded-user  $aide_user;
        proxy_set_header x-forwarded-proto $scheme;
        proxy_set_header x-forwarded-host  $host;
        proxy_set_header x-forwarded-for   $proxy_add_x_forwarded_for;
        proxy_set_header x-real-ip         $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://openclaw_admin;
    }
    # The Control UI auto-detects its WebSocket URL WITHOUT a trailing slash
    # (wss://…/leap-aide/u/admin), which the prefix location above (…/admin/)
    # never matches. This exact-match block proxies that bare path to the gateway
    # root so the dashboard connects automatically — no manual slash fix-up.
    location = /leap-aide/u/admin {
        auth_request /aide/api/auth/check;
        auth_request_set $aide_user $upstream_http_x_aide_user;
        proxy_set_header x-forwarded-user  $aide_user;
        proxy_set_header x-forwarded-proto $scheme;
        proxy_set_header x-forwarded-host  $host;
        proxy_set_header x-forwarded-for   $proxy_add_x_forwarded_for;
        proxy_set_header x-real-ip         $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://openclaw_admin/;
    }
    # Native OpenClaw Control UI at /aide/. The dev gateway runs with
    # `gateway.controlUi.basePath = "/aide"`, so the document and `/assets/*`
    # are served only under this prefix. No user segment: dev is single-user,
    # so the upstream is fixed; a multi-user stack picks `openclaw-<user>` from
    # `$aide_user` here instead. `/leap-aide/u/admin/` above stays for the
    # chat-shell WebSocket and the plugin HTTP routes.
    location /aide/ {
        auth_request /aide/api/auth/check;
        auth_request_set $aide_user $upstream_http_x_aide_user;
        proxy_set_header x-forwarded-user  $aide_user;
        proxy_set_header x-forwarded-proto $scheme;
        proxy_set_header x-forwarded-host  $host;
        proxy_set_header x-forwarded-for   $proxy_add_x_forwarded_for;
        proxy_set_header x-real-ip         $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://openclaw_admin;
    }
    # Bare-prefix WebSocket URL the Control UI auto-detects (no trailing slash).
    location = /aide {
        auth_request /aide/api/auth/check;
        auth_request_set $aide_user $upstream_http_x_aide_user;
        proxy_set_header x-forwarded-user  $aide_user;
        proxy_set_header x-forwarded-proto $scheme;
        proxy_set_header x-forwarded-host  $host;
        proxy_set_header x-forwarded-for   $proxy_add_x_forwarded_for;
        proxy_set_header x-real-ip         $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://openclaw_admin/;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name  dev.smartdata.local;
    return 301 https://$host$request_uri;
    # rewrite ^(.*)$ https://$host$1 permanent;
}
