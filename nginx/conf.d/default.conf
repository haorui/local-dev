# db
upstream dbadmin {
    server host.docker.internal:8084;
}

upstream dbweb {
    server host.docker.internal:3013;
}

# smartdata-mcp sidecar (TS, Streamable HTTP transport)
# 本地 dev 用 MCP_PORT=3010，避免与 dbgate-api 的 :3000 冲突
upstream mcp_smartdata {
    server host.docker.internal:3010;
}

# leap-aide auth authority (aide-auth, dev-container :3181) + per-user OpenClaw gateway (host services)
upstream aide_auth {
    server host.docker.internal:3181;
}
upstream openclaw_admin {
    server host.docker.internal:18789;
}
# leap-aide admin console — Vite dev server (base=/aide-admin/). Vite serves
# the SPA with HMR and proxies /aide-admin/api to the admin server on :3280;
# whoever owns :3280 decides the data mode (make dev-up's built server = mock,
# a manual `pnpm dev:server` + .env.local = real acceptance sources). See
# leap-aide dev/README.md §"Admin console against real data".
upstream aide_admin_vite {
    server host.docker.internal:5280;
}
# leap-aide worktree dev frontend (Vite, parallel to the native /aide/ below)
upstream aide_wt {
    server host.docker.internal:5181;
}
# second worktree dev frontend slot (Vite :5182, base=/aide-wt2/) so two
# worktrees can be verified in parallel without evicting each other.
upstream aide_wt2 {
    server host.docker.internal:5182;
}

