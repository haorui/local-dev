services:
  gateway:
    image: nginx:1.25.3-alpine3.18
    container_name: nginx
    # Pin host.docker.internal to the Docker Desktop host-gateway IPv4. Without
    # this it resolves to an unreachable IPv6 on dev_db_network, which 502s
    # WebSocket upstreams (plain GETs recover via IPv4 fallback, WS upgrades do
    # not retry) — e.g. the OpenClaw gateway WS dropping fresh connections.
    extra_hosts:
      - "host.docker.internal:192.168.65.254"
    ports:
      - "80:80"
      - "443:443"
      - "8446:8446"
    # environment:
    #   - MY_VAR=${MY_VAR:-$(hostname)}
    # command: sh -c "echo MY_VAR is $BINARY_DOWNLOAD_VERSION"
    networks:
      - dev_db_network
      # leap-aide rendered deployment 的 ingress 网络。属主是 leap-aide 的
      # compose(它创建并持有),本栈只以 external 加入,永不删除它。
      # 启动顺序:leap-aide 栈先 up,本栈后 join(先启会 fail loud,属预期)。
      # 契约:leap-aide docs/architecture/web-tier-deployment.md §3。
      - leap-aide-edge
      # - dev_sso_network
    volumes:
      - ./conf.d:/etc/nginx/conf.d/
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl/
    restart: always

networks:
  dev_db_network:
    driver: bridge
    external: true
  leap-aide-edge:
    external: true
    name: leap-aide-edge
  # dev_sso_network:
  #   driver: bridge
  #   external: true
